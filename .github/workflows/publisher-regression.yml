# Lightweight publisher/maintenance regression validation on pull requests.
# No Chromium compilation, elevated token, state writes or publishing.
name: Publisher Regression Checks

on:
  # Runs on EVERY pull request: main is protected with this check required, so a
  # path-filtered trigger would leave docs-only PRs unmergeable.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (node24)
      - name: Run existing publisher, maintenance, and seccomp fixture regressions
        run: bash port/ci.sh selftest
