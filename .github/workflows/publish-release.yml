name: Publish Pre-release (reusable)
on:
  workflow_call:
    inputs:
      source: {type: string, required: true}
      ci_run_id: {type: string, required: true}
      artifact_name: {type: string, required: true}
      deb_version: {type: string, required: true}
      deb_sha256: {type: string, required: true}
      termux_sha: {type: string, required: true}
      port_sha: {type: string, required: true}
      build_signature: {type: string, required: false, default: ''}
      build_timestamp: {type: string, required: false, default: ''}
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-26.04
    steps:
      - run: echo bisect-ok
