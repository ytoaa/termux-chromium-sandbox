# Round 17 (v2 final) — GitHub Pre-release publishing for CI-verified DEBs.
#
# WHY workflow_run: this GitHub instance REJECTS elevated `permissions`
# (actions:write) on ordinary jobs and any caller-side `permissions:` on
# `uses:` jobs with startup_failure (bisection runs 40217322460..
# 40220026845; revert PR #8). `contents: write` at the TOP of a standalone
# workflow is proven-accepted. So both entry points (nightly maintenance
# run, direct manual build run) AUTO-TRIGGER this workflow on completion
# with ZERO caller changes, and the publisher itself decides — fail-closed
# and idempotently — whether a pre-release is due.
#
# Hard boundaries (Round 17 spec):
#  * PRE-RELEASE only; stable/apt/validated are separate human approvals.
#  * Publish state SEPARATE from build state: never touches
#    maintenance-state, never reclassifies a build. Publish failure = re-run
#    THIS workflow's run (`gh run rerun <id>`) or wait for the nightly —
#    never a Chromium rebuild; the artifact is already there.
#  * Draft-first; tags/releases/assets never clobbered, edited or deleted.
#  * Ledger gate re-executed by the publisher from maintenance-state:
#    only a BUILD_VERIFIED_CANDIDATE recorded for THIS run id publishes.
#    dry-run/skip/blocked/failed/branch runs => NO-OP success (nothing to
#    publish) — never an accidental release.
name: Publish Pre-release

on:
  # One-time, operator-confirmed recovery for the already-built 2026-10-26
  # revision-3 artifact. No rebuild, no implicit bypass for other run IDs.
  workflow_dispatch:
    inputs:
      recovery_run_id:
        description: 'One-time legacy recovery run ID (40254429486 only)'
        type: string
        required: true
      recovery_expected_sha256:
        description: 'SHA256 of the exact DEB inside that run artifact'
        type: string
        required: true
      recovery_ack:
        description: 'Type PUBLISH-LEGACY-BUILD-40254429486 to authorize publishing'
        type: string
        required: true
  workflow_run:
    workflows:
      - Daily Maintenance
      - Build Termux Chromium Seccomp Sandbox Port
    types: [completed]

permissions:
  contents: write   # the ONLY write scope (release create); top-level standalone
  actions: read     # cross-run artifact download requires explicit read token

concurrency:
  group: publish-release-queue
  cancel-in-progress: false

jobs:
  publish:
    name: Classify + verify + publish pre-release
    # Only SUCCESSFUL completions of the two build-capable workflows on the
    # DEFAULT branch. workflow_call builds belong to the CALLER run
    # ('Daily Maintenance'), so maintenance builds flow through here after
    # the ledger push — publish-before-ledger is structurally impossible.
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
      || (github.event_name == 'workflow_dispatch' &&
          github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      # Publisher code is pinned from the default branch (supply-chain),
      # NOT from the triggered run's commit (which may be any ref).
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Classify trigger event (manual vs maintenance; fail-closed no-op otherwise)
        id: cls
        env:
          WF: ${{ github.event.workflow_run.name }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_HEAD: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_KIND: ${{ github.event_name }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          RECOVERY_SHA: ${{ inputs.recovery_expected_sha256 }}
          RECOVERY_ACK: ${{ inputs.recovery_ack }}
        run: |
          set -euo pipefail
          source=''
          recovery=false
          case "$TRIGGER_KIND" in
            workflow_dispatch)
              # Deliberately pinned ONE-TIME recovery only. Historical run
              # predates the artifact-bound consent marker. Explicit operator
              # acknowledgement and independently supplied DEB digest are
              # mandatory. Do not generalize into a legacy default-allow.
              [ "$RECOVERY_RUN_ID" = "40254429486" ] || { echo "::error::recovery run not allowlisted"; exit 1; }
              [ "$RECOVERY_ACK" = "PUBLISH-LEGACY-BUILD-40254429486" ] || { echo "::error::recovery acknowledgement missing"; exit 1; }
              [[ "$RECOVERY_SHA" =~ ^[a-f0-9]{64}$ ]] || { echo "::error::recovery DEB sha malformed"; exit 1; }
              RUN_ID="$RECOVERY_RUN_ID"
              RUN_HEAD="783efd63eeea89e2999e0408d55ea0de70fbed7c"
              source='manual'
              recovery=true
              {
                echo "EXPECT_VERSION=156.0.8078.47-3"
                echo "EXPECT_SHA=$RECOVERY_SHA"
                echo "EXPECT_SIG="
                echo "EXPECT_TERMUX="
                echo "EXPECT_TS="
              } >> "$GITHUB_ENV"
              ;;
            workflow_run)
              case "$WF" in
                "Daily Maintenance")
                  source='maintenance' ;;
                "Build Termux Chromium Seccomp Sandbox Port")
                  [ "$RUN_EVENT" = "workflow_dispatch" ] || { echo "::error::unexpected manual source event"; exit 1; }
                  # The workflow_run.inputs.publish field is absent in real
                  # events; consent is checked against the source artifact.
                  source='manual' ;;
                *)
                  echo "unhandled workflow '$WF' — no-op" >> "$GITHUB_STEP_SUMMARY"
                  echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
              esac
              ;;
            *) echo "::error::unsupported publisher event"; exit 1 ;;
          esac
          echo "recovery=$recovery" >> "$GITHUB_OUTPUT"
          case "$RUN_ID" in ''|*[!0-9]*) echo "::error::run id malformed"; exit 1;; esac
          case "$RUN_HEAD" in *[!0-9a-f]*|'') echo "::error::head sha malformed"; exit 1;; esac
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run_head=$RUN_HEAD" >> "$GITHUB_OUTPUT"
          echo "artifact=build-$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "classification: source=$source run=$RUN_ID"

      - name: Provenance audit + ledger gate (fail closed; re-executed here)
        if: steps.cls.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.cls.outputs.run_id }}
          SOURCE: ${{ steps.cls.outputs.source }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID" > run.json
          jq -e '.status=="completed" and .conclusion=="success"' run.json >/dev/null
          if [ "${{ steps.cls.outputs.recovery }}" = "true" ]; then
            # A specific successful build on main, never a fabricated run.
            jq -e --arg sha "${{ steps.cls.outputs.run_head }}" \
              '.id==40254429486 and .name=="Build Termux Chromium Seccomp Sandbox Port" and .event=="workflow_dispatch" and .head_branch=="main" and .head_sha==$sha' run.json >/dev/null
          fi
          if [ "$SOURCE" = "maintenance" ]; then
            # THE LEDGER IS THE GATE — evaluated BEFORE any artifact check so
            # dry-run/skip/blocked runs (which never upload build-<id>)
            # end as normal no-op SUCCESS, not red failures. Only a
            # BUILD_VERIFIED_CANDIDATE recorded for this exact run id
            # (ci_run==id, 64hex sha, 16hex sig) may proceed.
            if ! gh api "repos/${{ github.repository }}/contents/maintenance/state.json?ref=maintenance-state" \
                 --jq .content > state.b64 2>state.err; then
              if grep -qiE 'Not Found|No commit found' state.err; then
                echo "no maintenance-state yet — nothing to publish" >> "$GITHUB_STEP_SUMMARY"
                echo "SKIP_REMAIN=true" >> "$GITHUB_ENV"; exit 0
              fi
              echo "::error::state probe failed (not a 404) — fail closed"; tail -2 state.err; exit 1
            fi
            base64 -d state.b64 > state.json
            # Read-only ledger lookup (port/publish_release.py): checks
            # last_successful_build AND candidates[] for a verified record
            # claiming THIS run id (defect B: a later build must not hide an
            # earlier candidate), enforces status/sha/version/signature/
            # termux shapes, refuses contradictory claims and currently
            # blocked signatures fail-closed (rc 1 = red, never a green
            # no-op), and returns 4 only when NOTHING claims the run.
            if python3 port/publish_release.py ledger-lookup \
                 --state state.json --run-id "$RUN_ID" --out ledger.json; then
              {
                echo "EXPECT_VERSION=$(jq -r '.deb_version' ledger.json)"
                echo "EXPECT_SHA=$(jq -r '.deb_sha256' ledger.json)"
                echo "EXPECT_SIG=$(jq -r '.signature' ledger.json)"
                echo "EXPECT_TERMUX=$(jq -r '.termux_sha' ledger.json)"
                echo "EXPECT_TS=$(jq -r '.recorded_at // ""' ledger.json)"
              } >> "$GITHUB_ENV"
            else
              lrc=$?
              case "$lrc" in
                4)
                  echo "no verified candidate for run $RUN_ID (dry-run/skip/blocked/failed/unrecorded) — normal no-op" >> "$GITHUB_STEP_SUMMARY"
                  echo "SKIP_REMAIN=true" >> "$GITHUB_ENV"; exit 0 ;;
                *)
                  echo "::error::ledger lookup refused (rc=$lrc) — contradictory, blocked or malformed claim for run $RUN_ID; fail closed"
                  exit "$lrc" ;;
              esac
            fi
          else
            # manual path: no ledger contract — a successful build run MUST
            # own its build-<run> artifact; absence is a real anomaly (red).
            echo "SKIP_REMAIN=false" >> "$GITHUB_ENV"
            if [ "${{ steps.cls.outputs.recovery }}" != "true" ]; then
              echo "EXPECT_VERSION=" >> "$GITHUB_ENV"
              echo "EXPECT_SHA=" >> "$GITHUB_ENV"
              echo "EXPECT_SIG=" >> "$GITHUB_ENV"
              echo "EXPECT_TERMUX=" >> "$GITHUB_ENV"
              echo "EXPECT_TS=" >> "$GITHUB_ENV"
            fi
          fi
          # artifact ownership (both paths, AFTER the ledger no-op above)
          gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" > artifacts.json
          jq -e --arg n "build-$RUN_ID" \
            '[.artifacts[] | select(.name==$n and .expired==false)] | length == 1' \
            artifacts.json >/dev/null
          echo "SKIP_REMAIN=false" >> "$GITHUB_ENV"
          echo "provenance ok: run $RUN_ID succeeded; artifact build-$RUN_ID owned"

      - name: Download candidate artifact (pinned to the audited run)
        if: env.SKIP_REMAIN != 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.cls.outputs.artifact }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.cls.outputs.run_id }}
          path: artifact

      # The upstream workflow_run event does NOT include reliable inputs.
      # Never publish a direct manual build without its artifact-bound
      # consent record (except the single tightly pinned recovery above).
      - name: Verify manual publish consent (fail closed)
        if: env.SKIP_REMAIN != 'true' && steps.cls.outputs.source == 'manual' && steps.cls.outputs.recovery != 'true'
        env:
          EXPECTED_RUN_ID: ${{ steps.cls.outputs.run_id }}
          EXPECTED_HEAD_SHA: ${{ steps.cls.outputs.run_head }}
        run: |
          set -euo pipefail
          marker=artifact/publish-intent.json
          if [ ! -f "$marker" ]; then
            echo "::error::missing artifact-bound manual publish intent; refusing publication"
            exit 1
          fi
          if ! jq -e --arg run "$EXPECTED_RUN_ID" --arg sha "$EXPECTED_HEAD_SHA" \
              '.schema==1 and .event=="workflow_dispatch" and .run_id==$run and .head_sha==$sha and (.publish==true or .publish==false)' \
              "$marker" >/dev/null; then
            echo "::error::manual publish intent invalid or bound to a different run"
            exit 1
          fi
          if [ "$(jq -r '.publish' "$marker")" != "true" ]; then
            echo "SKIP_REMAIN=true" >> "$GITHUB_ENV"
            echo "manual run $EXPECTED_RUN_ID explicitly opted out; no Release" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "manual publish consent verified for run $EXPECTED_RUN_ID"

      - name: Integrity verification (self-derives expectations from artifact; ledger values re-checked)
        if: env.SKIP_REMAIN != 'true'
        id: derive
        run: |
          set -euo pipefail
          deb=$(find artifact -name 'chromium-sandboxed_*_aarch64.deb' | head -1)
          test -n "$deb" || { echo "::error::no deb in artifact"; exit 1; }
          ver=$(dpkg-deb -f "$deb" Version)
          sha=$(sha256sum "$deb" | cut -d' ' -f1)
          pin=$(find artifact -name termux-pin.txt | head -1 || true)
          tsha="${EXPECT_TERMUX:-}"
          if [ -z "$tsha" ] && [ -n "$pin" ]; then tsha=$(tr -d '[:space:]' < "$pin"); fi
          # ledger cross-check (maintenance): derived == recorded or refuse
          if [ -n "${EXPECT_VERSION:-}" ] && { [ "$ver" != "$EXPECT_VERSION" ] || [ "$sha" != "$EXPECT_SHA" ]; }; then
            echo "::error::artifact ($ver/$sha) != ledger ($EXPECT_VERSION/$EXPECT_SHA) — refusing"; exit 1
          fi
          {
            echo "deb_version=$ver"
            echo "deb_sha256=$sha"
            echo "termux_sha=$tsha"
          } >> "$GITHUB_OUTPUT"
          python3 port/publish_release.py verify \
            --artifact-dir artifact \
            --deb-version "$ver" \
            --deb-sha256 "$sha" \
            --termux-sha "$tsha" \
            --port-sha "${{ steps.cls.outputs.run_head }}" \
            --source "${{ steps.cls.outputs.source }}" \
            --ci-run-id "${{ steps.cls.outputs.run_id }}" \
            --ci-run-url "https://github.com/${{ github.repository }}/actions/runs/${{ steps.cls.outputs.run_id }}" \
            --artifact-name "${{ steps.cls.outputs.artifact }}" \
            --build-signature "${EXPECT_SIG:-}" \
            --build-timestamp "${EXPECT_TS:-}" \
            --run-audit-json run.json --artifacts-json artifacts.json \
            --out verified.json

      - name: Fetch release state + plan (dedup/collision/resume)
        if: env.SKIP_REMAIN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="chromium-sandboxed-v${{ steps.derive.outputs.deb_version }}"
          args=(--out publish-plan.json)
          if gh api "repos/${{ github.repository }}/releases/tags/$TAG" > release.json 2>rel.err; then
            args+=(--release-json release.json)
          elif grep -qiE 'Not Found|release_tag_does_not_exist' rel.err; then
            echo "no release for $TAG (fresh publish)"
          else
            echo "::error::release probe failed (not a 404) — fail closed"; tail -2 rel.err; exit 1
          fi
          python3 port/publish_release.py plan --verified verified.json \
            --gh-bin gh --repo '${{ github.repository }}' "${args[@]}"

      # GitHub's Releases API requires Workflows:write when targeting a
      # historical commit with workflow-file changes relative to main.
      # The builtin GITHUB_TOKEN cannot have Workflows:write. Keep the exact
      # build SHA as release target; never quietly retarget it to main.
      - name: Authorize exact build-commit release target (fail closed)
        if: env.SKIP_REMAIN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.cls.outputs.run_head }}
          ELEVATED_TOKEN_CONFIGURED: ${{ secrets.TCS_RELEASE_WORKFLOWS_TOKEN != '' }}
        run: |
          set -euo pipefail
          action=$(jq -r '.action' publish-plan.json)
          case "$action" in
            already-published)
              echo "release already published — no creation authorization needed"
              exit 0 ;;
            publish|resume-draft) : ;;
            *) echo "::error::unknown publish plan action: $action"; exit 1 ;;
          esac
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::invalid source commit SHA"; exit 1; }
          case "$ELEVATED_TOKEN_CONFIGURED" in
            true)
              echo "dedicated release token supplied (Contents:write + Workflows:write required)"
              ;;
            false)
              # GitHub's default token is sufficient when the build SHA is
              # still the HEAD of the default branch. Old or moved commits
              # require an authorized token; never weaken source provenance.
              default_sha=$(gh api \
                "repos/${{ github.repository }}/git/ref/heads/${{ github.event.repository.default_branch }}" \
                --jq '.object.sha')
              [[ "$default_sha" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::cannot verify main HEAD"; exit 1; }
              if [ "$SOURCE_SHA" != "$default_sha" ]; then
                echo "::error::release target is a historical commit. Configure TCS_RELEASE_WORKFLOWS_TOKEN (repo-scoped Contents:write + Workflows:write), then re-run this publisher. No release or tag created."
                exit 1
              fi
              echo "source SHA equals current default-branch HEAD — builtin token permitted"
              ;;
            *) echo "::error::invalid release-token configuration state"; exit 1 ;;
          esac

      - name: Execute (draft -> assets -> verify -> pre-release)
        if: env.SKIP_REMAIN != 'true'
        env:
          # Prefer an optional, repo-scoped credential with both Contents:write
          # and Workflows:write for historical SHA targets. Only this final
          # publishing step receives it; read-only audit uses GITHUB_TOKEN.
          GH_TOKEN: ${{ secrets.TCS_RELEASE_WORKFLOWS_TOKEN || github.token }}
        run: |
          set -euo pipefail
          # Round 18 (defect A): do NOT wrap the publisher in `if ! cmd` —
          # bash resets $? to 0 inside a negated-if body, so failures could
          # exit 0 (GREEN) and hide a publish error. Positive if/else keeps
          # the publisher's exact exit code (0 ok / 1 integrity / 2
          # collision / 3 transient), asserted by the e-series tests.
          if python3 port/publish_release.py execute --plan publish-plan.json \
              --verified verified.json --repo '${{ github.repository }}' \
              --gh-bin gh --out publish-result.json; then
            echo "Pre-release publisher completed"
          else
            rc=$?
            echo "::error::publish step failed (rc=$rc). The Chromium BUILD and the candidate ledger are UNAFFECTED — re-run THIS run (gh run rerun ${{ github.run_id }}) or wait for the nightly; never rebuild Chromium for a publish problem."
            exit "$rc"
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Pre-release publish"
            echo "- source: \`${{ steps.cls.outputs.source || 'n/a' }}\`  run: \`${{ steps.cls.outputs.run_id || 'n/a' }}\`"
            if [ "${SKIP_REMAIN:-false}" = "true" ]; then echo "- **no-op**: nothing to publish (ledger gate / opt-out / unhandled source)"; fi
            if [ -f publish-plan.json ]; then echo "- plan: \`$(jq -c '{action,reason}' publish-plan.json)\`"; fi
            if [ -f publish-result.json ]; then echo "- result: \`$(jq -c . publish-result.json)\`"; fi
            echo "- status: **CI VERIFIED — DEVICE NOT VERIFIED** (device checks are the user's responsibility)"
          } >> "$GITHUB_STEP_SUMMARY"
