# Cloud build of the seccomp-only sandbox port (Phase 2a).
# Scope: build + gates + artifacts (+ Round 17: CI-verified direct builds
# publish a GitHub PRE-RELEASE through the shared publisher, never apt,
# never stable, never validated promotion — those remain separate human
# approvals). No merge authority (per the 2026-10 incident lessons).
name: Build Termux Chromium Seccomp Sandbox Port

on:
  workflow_dispatch:
    inputs:
      termux_ref:
        description: termux-packages ref to build
        default: master
      force:
        description: Build even when versions already match (reserved)
        type: boolean
        default: false
      pkg_revision:
        description: TERMUX_PKG_REVISION override (empty = unchanged; used by maintenance revision builds)
        type: string
        default: ""
      publish:
        description: Publish successful direct builds as GitHub Pre-release
        type: boolean
        default: true
  workflow_call:
    inputs:
      termux_ref:
        description: termux-packages exact commit sha (pinned by maintenance probe)
        type: string
        required: true
      pkg_revision:
        description: TERMUX_PKG_REVISION override (empty = unchanged)
        type: string
        required: false
        default: ""
      source:
        description: caller identity for audit (maintenance|manual)
        type: string
        required: false
        default: "maintenance"
    outputs:
      deb_sha256:
        value: ${{ jobs.build.outputs.deb_sha256 }}
      deb_version:
        value: ${{ jobs.build.outputs.deb_version }}
      termux_sha:
        value: ${{ jobs.build.outputs.termux_sha }}
      port_sha:
        value: ${{ jobs.build.outputs.port_sha }}

# Serializes manual + maintenance builds: never two builds at once, no
# cancel-in-progress (an in-flight 1h build is never thrown away).
concurrency:
  group: build-chromium-serial
  cancel-in-progress: false

permissions:
  contents: read

env:
  TERMUX_BUILDER_IMAGE_NAME: termux-chromium-builder:sccache

jobs:
  gate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Transformer + recipe self-test (fail closed)
        run: bash port/ci.sh selftest
      - name: Resolve termux-packages ref to exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash port/ci.sh resolve-ref '${{ inputs.termux_ref }}' > termux-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: gate
          path: |
            termux-commit.txt
            port/port.toml

  build:
    needs: gate
    runs-on: ubuntu-26.04
    timeout-minutes: 350
    env:
      TERMUX_SANDBOXED_REVISION: ${{ inputs.pkg_revision }}
    outputs:
      deb_sha256: ${{ steps.emit.outputs.deb_sha256 }}
      deb_version: ${{ steps.emit.outputs.deb_version }}
      termux_sha: ${{ steps.emit.outputs.termux_sha }}
      port_sha: ${{ steps.emit.outputs.port_sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Checkout termux-packages (ref from inputs; sha recorded for audit)
        uses: actions/checkout@v7
        with:
          repository: termux/termux-packages
          path: termux-packages
          ref: ${{ inputs.termux_ref }}
      - name: Record pins
        run: |
          echo "port_sha=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "termux_sha=$(git -C termux-packages rev-parse HEAD)" >> "$GITHUB_ENV"
          git -C termux-packages rev-parse HEAD > termux-pin.txt
      - name: Prepare chromium-sandboxed recipe (identity + injected hook)
        run: bash port/ci.sh recipe-prepare "$PWD/termux-packages"
      - name: Restore sccache
        uses: actions/cache/restore@v4
        with:
          path: termux-packages/.sccache
          key: chromium-sccache-aarch64-${{ env.termux_sha }}
          restore-keys: chromium-sccache-aarch64-
      - name: Prepare Termux zram workspace bridge
        run: bash port/ci.sh prepare-zram-workspace "$PWD/termux-packages"
      - name: Enable zram
        uses: ./.github/actions/zram
      - name: Prepare Termux builder (docker + sccache image)
        run: bash port/ci.sh prepare-builder "$PWD/termux-packages"
      - name: Build chromium-sandboxed (port hook runs at post_get_source)
        run: bash port/ci.sh build "$PWD/termux-packages"
      - name: Package gates (separate identity, port applied)
        run: |
          set -euo pipefail
          deb=$(find termux-packages/output -name 'chromium-sandboxed_*_aarch64.deb' | head -1)
          test -n "$deb" || { echo "deb missing"; exit 1; }
          pkg=$(dpkg-deb -f "$deb" Package)
          ver=$(dpkg-deb -f "$deb" Version)
          [ "$pkg" = "chromium-sandboxed" ] || { echo "wrong package name: $pkg"; exit 1; }
          echo "artifact: $pkg $ver"
          # Fail-closed rule enforcement lives IN the hook (post_get_source
          # exits 1 unless >=5 rules applied; runs inside the build container).
          # Here the log mirror is best-effort evidence (container->host mirror
          # proved flaky, runs #18-#20): hard-fail only if it EXISTS but lacks
          # a rule; absence is a WARN, not a veto.
          log=$(find termux-packages -name 'port-apply*.log' 2>/dev/null | head -1 || true)
          if [ -n "$log" ]; then
            for r in R1 R2 R3 R4 R5 R9a; do
              grep -E 'APPLIED|ALREADY_PRESENT' "$log" | grep -q "$r" || { echo "$r not applied"; exit 1; }
            done
            echo "port-apply log evidence ok ($log)"
          else
            echo "WARN: port-apply mirror absent; relying on hook-side counter (fail-closed at source)"
          fi
          # bionic shield packaging gates (run #25 lesson: 'cat > symlink'
          # clobbered the launcher, which then exec'd itself).
          # NOTE (run #26): never pipe dpkg-deb into 'grep -q' - grep exits at
          # the first match, tar dies of SIGPIPE and pipefail turns a perfectly
          # good package into a red build. Match the listing in bash instead.
          listing=$(dpkg-deb -c "$deb")
          case "$listing" in
            *lib/chromium-sandboxed/libtermux-gnp-fix.so*) : ;;
            *) echo "shield .so missing from deb"; exit 1 ;;
          esac
          case "$listing" in
            *lib/chromium-sandboxed/chromium-shield-wrapper.sh*) : ;;
            *) echo "shield wrapper missing from deb"; exit 1 ;;
          esac
          tmpd=$(mktemp -d); dpkg-deb -x "$deb" "$tmpd"
          lp="$tmpd/data/data/com.termux/files/usr/lib/chromium-sandboxed/chromium-launcher.sh"
          if grep -q 'libtermux-gnp-fix.so' "$lp"; then
            echo "launcher clobbered (recursion risk)"; rm -rf "$tmpd"; exit 1
          fi
          grep -q 'chromium-launcher.sh' "$tmpd/data/data/com.termux/files/usr/lib/chromium-sandboxed/chromium-shield-wrapper.sh" \
            || { echo "wrapper does not exec the real launcher"; rm -rf "$tmpd"; exit 1; }
          rm -rf "$tmpd"
          echo "PORT GATES PASS: $pkg $ver"
      - name: Emit outputs (maintenance pipeline)
        id: emit
        if: always()
        run: |
          deb=$(ls termux-packages/output/chromium-sandboxed_*_aarch64.deb 2>/dev/null | head -1 || true)
          if [ -n "$deb" ]; then
            echo "deb_sha256=$(sha256sum "$deb" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
            echo "deb_version=$(dpkg-deb -f "$deb" Version)" >> "$GITHUB_OUTPUT"
          fi
          echo "termux_sha=$(cat termux-pin.txt 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
          echo "port_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Save sccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: termux-packages/.sccache
          key: chromium-sccache-aarch64-${{ env.termux_sha }}-${{ github.run_id }}
      - name: Upload artifacts (debs + logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.run_id }}
          path: |
            termux-packages/output/chromium-sandboxed_*_aarch64.deb
            termux-packages/chromium-build.log
            termux-packages/port-apply-chromium.log
            termux-packages/**/port-apply-chromium.log
            termux-pin.txt
          if-no-files-found: warn

  publishmode:
    name: Decide publish eligibility (no inputs-context in job if:)
    needs: build
    if: needs.build.result == 'success' && needs.build.outputs.deb_sha256 != ''
        && needs.build.outputs.deb_version != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      want: ${{ steps.d.outputs.want }}
    steps:
      - id: d
        # The `inputs` named-value is unavailable in job-level `if:` for
        # ordinary (workflow_dispatch) runs — resolve it in bash instead:
        # schedule/dispatch event-safety pattern, exact string matches,
        # fail-closed default want=false.
        env:
          SRC: ${{ inputs.source }}
          PUB: ${{ github.event.inputs.publish }}
        run: |
          want=false
          case "$SRC" in
            maintenance|'') : ;;  # called-by-maintenance or absent: DEFER
            *) case "$PUB" in
                 false|False|FALSE) : ;;
                 true|True|TRUE) want=true ;;
                 *) want=false ;;  # unknown string -> fail closed
               esac ;;
          esac
          echo "want=$want" >> "$GITHUB_OUTPUT"
          echo "publishmode: src=[$SRC] want=$want"

  publish:
    name: Pre-release (direct builds only)
    needs: publishmode
    if: needs.publishmode.outputs.want == 'true'
    uses: ./.github/workflows/probe-call.yml
    with:
      source: manual
      deb_version: "156.0.8078.47-9"
    permissions:
      contents: write
