# DIAGNOSTIC ONLY (branch diag/ci-node24): attribute the node24 externals
# disappearance in build jobs since 2026-10-27. No build, no publish, no
# policy content. permissions stay read.
name: DIAG node24 attribution

on:
  push:
    branches: [diag/ci-node24]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: ENV baseline
        continue-on-error: true
        run: |
          id; echo "HOME=$HOME"
          env | grep -E '^RUNNER_|AGENT_TOOLS|^GITHUB_' | sort
          ls -la ~/actions-runner 2>&1 | head -20
          ls -laR ~/actions-runner/cached 2>&1 | head -40
          find ~/actions-runner /opt -maxdepth 7 -name node -type f 2>/dev/null | head -10
          namei -l ~/actions-runner/cached/2.338.0/externals/node24/bin/node 2>&1 || true
          ls -la /opt 2>&1
          findmnt -o TARGET,SOURCE,FSTYPE 2>/dev/null | grep -Ei 'runner|opt|cache' || true
          df -h; df -i
      - name: Node action check BEFORE deletes
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: core.setOutput('ok', 'yes')
      - name: P1 safe dirs
        continue-on-error: true
        run: |
          bash diag/node-probe.sh P1-before
          sudo rm -rf /opt/ghc /opt/az /opt/pipx /usr/share/dotnet /usr/share/swift /usr/share/miniconda /usr/share/az_* /usr/share/gradle-* /usr/share/java /home/runner/.rustup /etc/skel /home/packer /home/linuxbrew /usr/src
          bash diag/node-probe.sh P1-after
      - name: P2 runner-cache
        continue-on-error: true
        run: |
          bash diag/node-probe.sh P2-before
          sudo rm -rf /opt/runner-cache
          bash diag/node-probe.sh P2-after
      - name: P3 hostedtoolcache and actionarchivecache
        continue-on-error: true
        run: |
          bash diag/node-probe.sh P3-before
          sudo rm -rf /opt/hostedtoolcache /opt/actionarchivecache
          bash diag/node-probe.sh P3-after
      - name: P4 AGENT_TOOLSDIRECTORY
        continue-on-error: true
        run: |
          bash diag/node-probe.sh P4-before
          if [ -n "${AGENT_TOOLSDIRECTORY:-}" ]; then sudo rm -rf "$AGENT_TOOLSDIRECTORY"; else echo "AGENT_TOOLSDIRECTORY unset"; fi
          bash diag/node-probe.sh P4-after
      - name: P5 /usr/local
        continue-on-error: true
        run: |
          bash diag/node-probe.sh P5-before
          sudo mv /usr/local /usr.local.removed-by-diag 2>/dev/null || sudo rm -rf /usr/local
          bash diag/node-probe.sh P5-after
      - name: Node action check AFTER deletes
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: core.setOutput('ok', 'yes')
