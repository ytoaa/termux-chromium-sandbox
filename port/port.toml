# Prior validated baseline run #28 / 155.0.8059.84 preserved in gates.device_gate_history.
[port]
version = "0.1.0"
phase = "validated"            # feasibility | porting | gated-build | validated
last_validated_port = "0.1.0"
last_validated_chromium = "156.0.8078.47"
last_validated_deb_version = "156.0.8078.47-4"
last_validated_deb_sha256 = "6de791e29fc7389c999464bf9afa814d1029a34cba6e29451112abfdda7310e2"
last_validated_ci_run = 40382174596
last_validated_termux_sha = "de1dd3d18e239ef514e5c55ad744e6485e408c65"
last_validated_build_signature = "0aa721739cab92e1"
last_validated_port_commit = "688edfad53a99610d3a6dc751d4f461da9d323a8"
last_validated_promoted = "2026-10-27 manual human-approved promotion (Plan B: same -4 binary, R11 diagnostics retained; promotion PR promotion/r11-r4-validated; device audit issue #12; original RESULT_CODE_INVALID_SANDBOX_STATE remains INCONCLUSIVE \u2014 non-reproduced, NOT claimed solved)"
policy_mode = "fail-closed"

[termux]
package = "x11-packages/chromium"
prefix_placeholder = "@TERMUX_PREFIX@"
# Separate package identity constraint (user-mandated): the ported deb must
# NOT replace or overwrite stock 'chromium' install; naming finalized in
# Phase 2 (e.g. chromium + our own apt component vs distinct name).

[sandbox]
mode = "seccomp-only"          # namespaces kernel-blocked (CLONE_NEWUSER=EINVAL)
namespace_layer = "disabled"
setuid_sandbox = "forbidden"
require_bpf_policy = true
bionic_guard = "defined(__BIONIC__)"   # all port branches compile-guarded

[rules]                        # chromium_sandbox_port.py contract registry
[rules.r1]
name = "seccomp-only usable mode (Bionic)"
file = "content/browser/zygote_host/zygote_host_impl_linux.cc"
marker = "Termux seccomp-only sandbox:"
[rules.r2]
name = "skip namespace engage (Bionic)"
file = "sandbox/policy/linux/sandbox_linux.cc"
marker = "Termux seccomp-only port:"
[rules.r3]
name = "bionic prctl options (arm64-Android)"
file = "sandbox/linux/seccomp-bpf-helpers/syscall_parameters_restrictions.cc"
marker = "Termux seccomp-only bionic-prctl:"
[rules.r4]
name = "zygote passthrough (Bionic)"
file = "sandbox/policy/linux/sandbox_linux.cc"
marker = "Termux seccomp-only zygote passthrough:"
[rules.r5]
name = "stack-top prewarm (Bionic)"
file = "sandbox/policy/linux/sandbox_linux.cc"
marker = "Termux seccomp-only stack-top prewarm:"
[rules.r7]
name = "bionic stack cache (base + PA copy)"
file = "base/debug/stack_trace.cc"
marker = "Termux seccomp-only bionic stack cache:"
note = "os=linux builds on Android must keep upstream's bionic main-thread stack cache; otherwise GetStackEnd hits pthread_getattr_np post-BPF and bionic LOG(FATAL)s"
[rules.r8]
name = "bionic stack-top cache + prewarm entry (PA stack.cc)"
file = "base/allocator/partition_allocator/src/partition_alloc/stack/stack.cc"
marker = "Termux seccomp-only bionic stack-top:"
note = "partition_alloc stack-top lookup calls pthread_getattr_np unconditionally; cache the main-thread value and fill it from StartSeccompBPF before the BPF denies /proc"

[rules.r9a]
name = "network getsockopt SO_DOMAIN (Bionic)"
file = "sandbox/policy/linux/bpf_network_policy_linux.cc"
marker = "Termux seccomp-only net-sockopt:"
note = "R9a VALIDATED in run #31 (156.0.8078.47, port 403274f, termux 64e02760, deb sha256 29c4080d...27c) — B/D battery: network utility ACT, restarts 0, CRASHING 0, no new SIGSYS; #28 B-signature (restarts 16/CRASHING 32) eliminated. Scope guard unchanged: exactly one (SOL_SOCKET, SO_DOMAIN) get-pair under __BIONIC__; no setsockopt, no SO_PROTOCOL. Feature remains DEFAULT-OFF; default-on requires separate approval."

[rules.r10]
name = "Bionic inherited SIGSYS handler reset before Chromium BPF"
file = "sandbox/policy/linux/sandbox_linux.cc"
marker = "Termux seccomp-only bionic-sigsys:"
note = "Experimental device-fix candidate ONLY (2026-10-26): on Android the app zygote owns SIGSYS; upstream SeccompStarterAndroid resets SIGSYS to SIG_DFL before SandboxBPF. Termux builds Linux-on-bionic, so the Android starter is skipped. R10 reserves SIGSYS only in __BIONIC__ children just before StartSandboxWithExternalPolicy; it does not relax policies or enable a fallback. Must pass sandbox device gate, crash-free navigation, BPF filter census and causality check before any promotion."

[rules.r11]
name = "Read-only SIGSYS handler ownership and Trap initialization ordering diagnostic"
file = "sandbox/linux/seccomp-bpf/trap.cc"
marker = "Termux seccomp-only r11-trap-owner:"
note = "DIAGNOSTIC ONLY / NO-GO (2026-10-26). R10 BPF filter count 2 was observed on device, yet one trap.cc:106 conflict recurred in PID/TID 14698:14706 BEFORE PID 14698 R10 init, and an earlier renderer crashed. R11 logs categorical pre-R10 SIGSYS action (default, ignored, installed), first Trap::Registry creation, and Trap::Trap previous action (default, ignored, chromium, foreign), without raw pointers and without changing existing R10 signal handling or BPF rules. Not a fix. Device verification and crash-free reproduction required; never publish or promote R11 diagnostics without independent approval."

[rules.r9b]
name = "PULSE_SERVER export in shield wrapper (packaging-level)"
file = "port/prepare_recipe.py"
marker = "Termux seccomp-only audio-pulse-server:"
note = "Zero privilege widening — audio server-selection behavior only. No C/C++/BPF/broker/syscall changes; user PULSE_SERVER (incl. empty string) respected; no-socket is a no-op. VALIDATED in run #31: AudioServiceSandbox ON on both devices — sandboxed utility owns PA stream (client pid in ACT set), in-window RMS audible, 60-min D soak, download manager + zombie checks closed. Feature remains DEFAULT-OFF; default-on requires separate approval."

[gates]
# Future candidate gates (firefox-pattern): source verify + binary markers +
# on-device level checks. Binary markers are checked inside the built
# chrome/libfrontend bits after packaging.
binary_markers = [
  "Termux seccomp-only sandbox:",
  "Termux seccomp-only port:",
]
required_media_codecs = ["h264", "vp9", "av1", "aac", "opus"]
require_bpf_per_process = true   # /proc Seccomp_filters must exceed Android baseline
